services:
  db:
    image: postgres:latest
    container_name: stockmaster-pro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: megashop
    ports:
      - "5432:5432"
    volumes:
      - ./01_database_schema.sql:/docker-entrypoint-initdb.d/init_database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
